<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Panel - Quotex Clone</title>
  <link rel="stylesheet" href="admin.css?v=6E3">

  <!-- Eruda Mobile Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    if (window.innerWidth < 900) {
      eruda.init();
    }
  </script>
</head>
<body>

  <!-- ============================================================
       HEADER
       ============================================================ -->
  <header class="admin-header">
    <div class="admin-header-left">
      <h1 class="admin-logo">Quotex <span>Admin</span></h1>
    </div>
    <div class="admin-header-right">
      <span id="admin-user-email" class="admin-user-email">-</span>
      <button id="admin-logout-btn" class="admin-logout-btn" type="button">Logout</button>
    </div>
  </header>

  <!-- ============================================================
       LOGIN SCREEN
       ============================================================ -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h2 class="login-title">Admin Login</h2>
      <input id="login-email" class="login-input" type="email" placeholder="Email" autocomplete="email">
      <input id="login-password" class="login-input" type="password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn" class="login-btn" type="button">Login</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>

  <!-- ============================================================
       MAIN PANEL
       ============================================================ -->
  <div id="admin-panel" class="admin-panel" style="display:none;">

    <!-- TABS -->
    <nav class="admin-tabs">
      <button class="admin-tab active" data-tab="markets" type="button">Markets</button>
      <button class="admin-tab" data-tab="candles" type="button">Candle Scheduler</button>
      <button class="admin-tab" data-tab="users" type="button">Users</button>
      <button class="admin-tab" data-tab="trades" type="button">Trades</button>
      <button class="admin-tab" data-tab="deposits" type="button">Deposits</button>
      <button class="admin-tab" data-tab="withdrawals" type="button">Withdrawals</button>
      <button class="admin-tab" data-tab="settings" type="button">Settings</button>
    </nav>

    <!-- TAB: MARKETS -->
    <section id="tab-markets" class="admin-tab-content active">
      <h2 class="section-title">Markets</h2>
      <div class="market-form">
        <input id="market-name" class="admin-input" type="text" placeholder="Market Name (e.g. EUR/USD)">
        <input id="market-symbol" class="admin-input" type="text" placeholder="Symbol (e.g. EURUSD)">
        <input id="market-base" class="admin-input" type="number" step="0.00001" placeholder="Base Price">
        <input id="market-payout" class="admin-input" type="number" placeholder="Payout % (e.g. 85)">
        <input id="market-winrate" class="admin-input" type="number" placeholder="Win Rate % (e.g. 60)">
        <button id="market-add-btn" class="admin-btn primary" type="button">Add Market</button>
      </div>
      <div id="market-list" class="market-list"></div>
    </section>

    <!-- TAB: CANDLE SCHEDULER -->
    <section id="tab-candles" class="admin-tab-content">

      <!-- PART 6E-1: CANDLE MODE SWITCH -->
      <div class="candle-mode-section">
        <div class="candle-mode-title">Candle Mode</div>
        <div class="candle-mode-buttons">
          <button class="mode-btn" data-mode="locked" type="button">
            <span class="mode-icon">[L]</span>
            <span class="mode-label">LOCKED</span>
          </button>
          <button class="mode-btn" data-mode="random" type="button">
            <span class="mode-icon">[R]</span>
            <span class="mode-label">RANDOM</span>
          </button>
          <button class="mode-btn" data-mode="mixed" type="button">
            <span class="mode-icon">[M]</span>
            <span class="mode-label">MIXED</span>
          </button>
          <button class="mode-btn" data-mode="schedule" type="button">
            <span class="mode-icon">[S]</span>
            <span class="mode-label">SCHEDULE</span>
          </button>
        </div>
        <div class="candle-mode-info" id="candle-mode-info">
          <strong>LOCKED:</strong> Admin-er save kora candle user-er kache exact jabe.
        </div>
      </div>

      <!-- Market + Timeframe Select -->
      <div class="candle-controls">
        <select id="candle-market-select" class="admin-input">
          <option value="">Select Market</option>
        </select>
        <select id="candle-timeframe" class="admin-input">
          <option value="1m">1 Minute</option>
          <option value="5m">5 Minutes</option>
          <option value="15m">15 Minutes</option>
          <option value="1h">1 Hour</option>
          <option value="1d">1 Day</option>
        </select>
      </div>

      <!-- Bulk Generate -->
      <div class="bulk-generate">
        <h3 class="subsection-title">Bulk Generate</h3>
        <input id="bulk-date" class="admin-input" type="date">
        <input id="bulk-time" class="admin-input" type="time">
        <input id="bulk-count" class="admin-input" type="number" placeholder="Count (e.g. 20)">
        <input id="bulk-base" class="admin-input" type="number" step="0.00001" placeholder="Base Price">
        <input id="bulk-up" class="admin-input" type="number" placeholder="Up %">
        <input id="bulk-down" class="admin-input" type="number" placeholder="Down %">
        <input id="bulk-neutral" class="admin-input" type="number" placeholder="Neutral %">
        <input id="bulk-wick" class="admin-input" type="number" placeholder="Wick Length">
        <input id="bulk-body" class="admin-input" type="number" placeholder="Body Size">
        <input id="bulk-size" class="admin-input" type="number" placeholder="Size (pips)">
        <button id="bulk-generate-btn" class="admin-btn primary" type="button">Generate</button>
      </div>

      <!-- Candle Action Buttons -->
      <div class="candle-actions">
        <button id="add-candle-btn" class="admin-btn" type="button">+ Add Candle</button>
        <button id="save-candles-btn" class="admin-btn primary" type="button">Save to Firestore</button>
        <button id="clear-candles-btn" class="admin-btn danger" type="button">Clear All</button>
        <button id="refresh-candles" class="admin-btn" type="button">Refresh</button>
      </div>

      <!-- Export / Import -->
      <div class="candle-io">
        <button id="export-candles-btn" class="admin-btn" type="button">Export JSON</button>
        <button id="import-candles-btn" class="admin-btn" type="button">Import JSON</button>
        <input id="import-candles-file" type="file" accept=".json" style="display:none;">
      </div>

      <!-- Playback Controls -->
      <div class="playback-controls">
        <h3 class="subsection-title">Playback</h3>
        <button id="play-btn" class="admin-btn primary" type="button">Play</button>
        <button id="pause-btn" class="admin-btn" type="button">Pause</button>
        <button id="skip-btn" class="admin-btn" type="button">Skip</button>
        <button id="back-btn" class="admin-btn" type="button">Back</button>
        <button id="reset-btn" class="admin-btn danger" type="button">Reset</button>
        <input id="playback-speed" class="admin-input" type="number" placeholder="Speed (ms)" value="1000">
        <span id="playback-status" class="playback-status">Idle</span>
      </div>

      <!-- Auto Mode -->
      <div class="auto-mode-section">
        <h3 class="subsection-title">Auto Mode</h3>
        <button id="auto-mode-toggle" class="admin-btn" type="button">Auto Mode: OFF</button>
        <input id="auto-interval-input" class="admin-input" type="number" placeholder="Interval (ms)" value="5000">
        <button id="save-auto-interval" class="admin-btn" type="button">Save Interval</button>
      </div>

      <!-- Candle Table -->
      <div class="candle-table-wrap">
        <h3 class="subsection-title">Candle List</h3>
        <table class="candle-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Time</th>
              <th>O</th>
              <th>H</th>
              <th>L</th>
              <th>C</th>
              <th>Dir</th>
              <th>Size</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="candle-table-body"></tbody>
        </table>
      </div>

      <!-- Preview Chart -->
      <div class="candle-preview-wrap">
        <h3 class="subsection-title">Preview</h3>
        <div id="candle-preview" class="candle-preview"></div>
      </div>

      <!-- Direction Timeline -->
      <div class="direction-timeline-wrap">
        <h3 class="subsection-title">Direction Timeline</h3>
        <div id="direction-timeline" class="direction-timeline"></div>
      </div>

    </section>

    <!-- TAB: USERS -->
    <section id="tab-users" class="admin-tab-content">
      <h2 class="section-title">Users</h2>
      <div id="users-list" class="users-list"></div>
    </section>

    <!-- TAB: TRADES -->
    <section id="tab-trades" class="admin-tab-content">
      <h2 class="section-title">Trades</h2>
      <div id="trades-list" class="trades-list"></div>
    </section>

    <!-- TAB: DEPOSITS -->
    <section id="tab-deposits" class="admin-tab-content">
      <h2 class="section-title">Deposits</h2>
      <div id="deposits-list" class="deposits-list"></div>
    </section>

    <!-- TAB: WITHDRAWALS -->
    <section id="tab-withdrawals" class="admin-tab-content">
      <h2 class="section-title">Withdrawals</h2>
      <div id="withdrawals-list" class="withdrawals-list"></div>
    </section>

    <!-- TAB: SETTINGS -->
    <section id="tab-settings" class="admin-tab-content">
      <h2 class="section-title">Settings</h2>

      <div class="settings-group">
        <label class="settings-label">Win Rate (%)</label>
        <input id="win-rate-input" class="admin-input" type="number" placeholder="60">
        <button id="save-win-rate" class="admin-btn primary" type="button">Save</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Payout (%)</label>
        <input id="payout-input" class="admin-input" type="number" placeholder="85">
        <button id="save-payout" class="admin-btn primary" type="button">Save</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Auto Interval (ms)</label>
        <input id="auto-interval-input-settings" class="admin-input" type="number" placeholder="5000">
        <button id="save-auto-interval-settings" class="admin-btn primary" type="button">Save</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Win Rate Target (%)</label>
              <div class="settings-group">
        <label class="settings-label">Win Percent (%)</label>
        <input id="win-percent-input" class="admin-input" type="number" placeholder="80" min="0" max="100" value="80">
        <button id="save-win-percent" class="admin-btn primary" type="button">Save Win %</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Loss Percent (%)</label>
        <input id="loss-percent-input" class="admin-input" type="number" placeholder="30" min="0" max="100" value="30">
        <button id="save-loss-percent" class="admin-btn primary" type="button">Save Loss %</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Live Movement Speed (ms)</label>
              <div class="settings-group">
        <label class="settings-label">Trap Rate (%)</label>
        <input id="trap-rate-input" class="admin-input" type="number" placeholder="30" min="0" max="100" value="30">
        <button id="save-trap-rate" class="admin-btn primary" type="button">Save Trap Rate</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Delay Rate (%)</label>
        <input id="delay-rate-input" class="admin-input" type="number" placeholder="20" min="0" max="100" value="20">
        <button id="save-delay-rate" class="admin-btn primary" type="button">Save Delay Rate</button>
      </div>

      <div class="settings-group">
        <label class="settings-label">Mid-Reversal Rate (%)</label>
              <div class="settings-group">
        <label class="settings-label">Auto 24/7 Generation</label>
        <button id="auto-24h-toggle" class="admin-btn primary" type="button">Auto 24/7: OFF</button>
      </div>

      <div class="settings-group" style="margin-top: 20px;">
        <label class="settings-label" style="color: #ffb300; font-size: 14px;">🎨 Future Candle Designer</label>

        <label class="settings-label">Market</label>
        <select id="designer-market-select" class="admin-input">
          <option value="">-- Select Market --</option>
        </select>

        <label class="settings-label">Direction</label>
        <select id="designer-direction" class="admin-input">
          <option value="up">UP (Green)</option>
          <option value="down">DOWN (Red)</option>
          <option value="neutral">NEUTRAL (Doji)</option>
        </select>

        <label class="settings-label">Candle Type</label>
        <select id="designer-type" class="admin-input">
          <option value="small">Small</option>
          <option value="medium" selected>Medium</option>
          <option value="large">Large</option>
          <option value="doji">Doji</option>
        </select>

        <label class="settings-label">Body Size (px)</label>
        <input id="designer-body" class="admin-input" type="number" value="60" min="5" max="200">

        <label class="settings-label">Wick Length (px)</label>
        <input id="designer-wick" class="admin-input" type="number" value="20" min="0" max="150">

        <label class="settings-label">Open Price</label>
        <input id="designer-open" class="admin-input" type="number" step="0.01" value="50000">

        <label class="settings-label">Close Price</label>
        <input id="designer-close" class="admin-input" type="number" step="0.01" value="50100">

        <label class="settings-label">High Price</label>
        <input id="designer-high" class="admin-input" type="number" step="0.01" value="50150">

        <label class="settings-label">Low Price</label>
        <input id="designer-low" class="admin-input" type="number" step="0.01" value="49950">

        <button id="designer-save-btn" class="admin-btn primary" type="button">Save Candle Designer</button>
        <button id="designer-apply-btn" class="admin-btn" type="button">Apply to Next Candle</button>
        <button id="designer-reset-btn" class="admin-btn danger" type="button">Reset Designer</button>
      </div>
        <input id="reversal-rate-input" class="admin-input" type="number" placeholder="15" min="0" max="100" value="15">
        <button id="save-reversal-rate" class="admin-btn primary" type="button">Save Reversal Rate</button>
      </div>
        <input id="live-speed-input" class="admin-input" type="number" placeholder="500" min="100" max="5000" value="500">
        <button id="save-live-speed" class="admin-btn primary" type="button">Save Speed</button>
      </div>
        <input id="win-rate-target" class="admin-input" type="number" placeholder="60">
        <button id="save-win-rate-target" class="admin-btn primary" type="button">Save</button>
      </div>
    </section>

  </div>

  <!-- SCRIPTS -->
  <script type="module" src="admin.js?v=6E3"></script>

</body>
</html>
