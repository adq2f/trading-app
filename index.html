<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading App</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>

  <!-- লগইন পেজ -->
  <div id="login-page" class="page">
    <h1>লগইন</h1>
    <input type="email" id="email" placeholder="ইমেইল">
    <input type="password" id="password" placeholder="পাসওয়ার্ড">
    <button id="login-btn">লগইন</button>
    <button id="signup-btn">নতুন অ্যাকাউন্ট</button>
    <p id="message"></p>
  </div>

  <!-- ট্রেডিং পেজ -->
  <div id="dashboard-page" class="page hidden">
    <div class="header">
      <span class="balance-text">ব্যালেন্স: $<span id="balance">0</span></span>
      <button id="logout-btn" class="small-btn">লগআউট</button>
    </div>

    <div class="chart-container">
      <div id="price-display">
        <span class="asset-name">BTC/USD</span>
        <span id="current-price">0.00</span>
      </div>
      <div id="chart"></div>
    </div>

    <div class="trade-panel">
      <div class="trade-amount">
        <label>পরিমাণ ($)</label>
        <input type="number" id="trade-amount" value="10" min="1">
      </div>

      <div class="trade-time">
        <label>সময়</label>
        <div class="time-buttons">
          <button class="time-btn active" data-time="60">১ মিনিট</button>
          <button class="time-btn" data-time="300">৫ মিনিট</button>
        </div>
      </div>

      <div class="trade-buttons">
        <button id="call-btn" class="call-btn">CALL ▲</button>
        <button id="put-btn" class="put-btn">PUT ▼</button>
      </div>

      <p id="trade-message"></p>
    </div>

    <div class="active-trades">
      <h3>চলমান ট্রেড</h3>
      <div id="active-trades-list"></div>
    </div>

    <div class="trade-history">
      <h3>ট্রেড হিস্ট্রি</h3>
      <div id="history-list"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
