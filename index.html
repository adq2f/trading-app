<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotex Clone</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>

  <!-- লগইন পেজ -->
  <div id="login-page" class="page">
    <div class="logo-box">
      <div class="logo-icon">Q</div>
      <h1>Quotex Clone</h1>
      <p class="tagline">ট্রেড করুন, জিতুন</p>
    </div>
    <input type="email" id="email" placeholder="ইমেইল">
    <input type="password" id="password" placeholder="পাসওয়ার্ড">
    <button id="login-btn">লগইন</button>
    <button id="signup-btn" class="secondary-btn">নতুন অ্যাকাউন্ট</button>
    <p id="message"></p>
  </div>

  <!-- ট্রেডিং পেজ -->
  <div id="dashboard-page" class="page hidden">

    <!-- হেডার -->
    <div class="top-bar">
      <div class="user-info">
        <div class="avatar">👤</div>
        <div class="user-email" id="user-email-display">user@email.com</div>
      </div>
      <button id="logout-btn" class="icon-btn">⏻</button>
    </div>

    <!-- ব্যালেন্স কার্ড -->
    <div class="balance-card">
      <div class="balance-label">ডেমো ব্যালেন্স</div>
      <div class="balance-value">$<span id="balance">0</span></div>
      <div class="balance-change" id="balance-change"></div>
    </div>

    <!-- চার্ট সেকশন -->
    <div class="chart-section">

      <!-- ড্রয়িং টুলবার -->
      <div class="drawing-toolbar" id="drawing-toolbar">
        <button class="drawing-btn" data-tool="TrendLine" title="Trend Line">╱</button>
        <button class="drawing-btn" data-tool="HorizontalLine" title="Horizontal Line">━</button>
        <button class="drawing-btn" data-tool="VerticalLine" title="Vertical Line">┃</button>
        <button class="drawing-btn" data-tool="CrossLine" title="Cross Line">✚</button>
        <button class="drawing-btn" data-tool="Rectangle" title="Rectangle">▭</button>
        <button class="drawing-btn" data-tool="FibRetracement" title="Fibonacci">⌗</button>
        <button class="drawing-btn" data-tool="Ray" title="Ray">↗</button>
        <button class="drawing-btn" data-tool="ExtendedLine" title="Extended Line">⟶</button>
        <button class="drawing-btn" data-tool="ParallelChannel" title="Parallel Channel">▱</button>
        <button class="drawing-btn" data-tool="TextAnnotation" title="Text">T</button>
      </div>

      <div class="chart-header">
        <select id="asset-select" class="asset-selector-select">
          <option value="BTCUSDT">BTC/USDT</option>
          <option value="ETHUSDT">ETH/USDT</option>
          <option value="BNBUSDT">BNB/USDT</option>
          <option value="SOLUSDT">SOL/USDT</option>
          <option value="XRPUSDT">XRP/USDT</option>
          <option value="ADAUSDT">ADA/USDT</option>
          <option value="DOGEUSDT">DOGE/USDT</option>
          <option value="MATICUSDT">MATIC/USDT</option>
          <option value="DOTUSDT">DOT/USDT</option>
          <option value="LINKUSDT">LINK/USDT</option>
          <option value="AVAXUSDT">AVAX/USDT</option>
          <option value="LTCUSDT">LTC/USDT</option>
        </select>
        <div class="price-box">
          <span id="current-price">0.00</span>
          <span id="price-arrow" class="price-arrow">▲</span>
        </div>
      </div>
      <div id="chart"></div>
      <div class="chart-timeframe">
        <button class="tf-btn active" data-tf="1m">1m</button>
        <button class="tf-btn" data-tf="5m">5m</button>
        <button class="tf-btn" data-tf="15m">15m</button>
      </div>
    </div>

    <!-- ট্রেড প্যানেল -->
    <div class="trade-panel">
      <div class="trade-amount-row">
        <label>পরিমাণ ($)</label>
        <div class="amount-input-wrap">
          <button class="amount-btn" data-action="minus">−</button>
          <input type="number" id="trade-amount" value="10" min="1">
          <button class="amount-btn" data-action="plus">+</button>
        </div>
      </div>

      <div class="trade-time-row">
        <label>সময়</label>
        <div class="time-buttons">
          <button class="time-btn active" data-time="60">01:00</button>
          <button class="time-btn" data-time="300">05:00</button>
          <button class="time-btn" data-time="900">15:00</button>
        </div>
      </div>

      <div id="big-timer" class="big-timer hidden">01:00</div>

      <div class="trade-buttons">
        <button id="call-btn" class="call-btn">
          <span class="arrow">▲</span>
          <span class="btn-label">CALL</span>
        </button>
        <button id="put-btn" class="put-btn">
          <span class="arrow">▼</span>
          <span class="btn-label">PUT</span>
        </button>
      </div>

      <p id="trade-message"></p>
    </div>

    <!-- ট্যাব -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="active">চলমান <span id="active-count">0</span></button>
      <button class="tab-btn" data-tab="history">হিস্ট্রি</button>
    </div>

    <div class="tab-content">
      <div id="active-trades-list" class="tab-pane active">
        <p class="empty-text">কোনো চলমান ট্রেড নেই</p>
      </div>
      <div id="history-list" class="tab-pane">
        <p class="empty-text">এখনো কোনো ট্রেড সম্পন্ন হয়নি</p>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
