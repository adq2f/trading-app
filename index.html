<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0e17">
  <title>Quotex Clone</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body>

  <!-- ========== লগইন পেজ ========== -->
  <div id="login-page" class="page">

    <!-- লোগো + নাম -->
    <div class="logo-box">
      <div class="logo-icon">Q</div>
      <h1>Quotex Clone</h1>
      <p class="tagline">ট্রেড করুন, জিতুন</p>
    </div>

    <!-- ইনপুট ফিল্ড -->
    <div class="input-group">
      <label>ইমেইল</label>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email">
    </div>

    <div class="input-group">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <!-- বাটন -->
    <button id="login-btn" class="primary-btn">লগইন</button>
    <button id="signup-btn" class="secondary-btn">নতুন অ্যাকাউন্ট</button>

    <!-- মেসেজ -->
    <p id="message"></p>

  </div>

    <!-- ========== ট্রেডিং পেজ (Dashboard) ========== -->
  <div id="dashboard-page" class="hidden">

    <!-- ===== উপরের হেডার (Quotex-এর মতো) ===== -->
    <div class="top-header">

      <!-- বাম: প্রোফাইল -->
      <div class="header-left">
        <button id="profile-btn" class="icon-btn">👤</button>
      </div>

      <!-- মাঝে: লোগো -->
      <div class="header-center">
        <span class="header-logo">Q</span>
        <span class="header-title">Quotex Clone</span>
      </div>

      <!-- ডান: লগআউট -->
      <div class="header-right">
        <button id="logout-btn" class="icon-btn">⏻</button>
      </div>
    </div>

    <!-- ===== ব্যালেন্স কার্ড (Quotex-এর মতো) ===== -->
    <div class="balance-card">

      <!-- উপরে: ডেমো/রিয়েল টগল -->
      <div class="account-toggle">
        <button class="acc-btn active" data-acc="demo">ডেমো</button>
        <button class="acc-btn" data-acc="real">রিয়েল</button>
      </div>

      <!-- ব্যালেন্স -->
      <div class="balance-display">
        <div class="balance-label">ব্যালেন্স</div>
        <div class="balance-value">$<span id="balance">0.00</span></div>
        <div class="balance-change" id="balance-change"></div>
      </div>

      <!-- ডিপোজিট + উইথড্র বাটন -->
      <div class="balance-actions">
        <button id="deposit-btn" class="action-btn deposit">＋ ডিপোজিট</button>
        <button id="withdraw-btn" class="action-btn withdraw">↗ উইথড্র</button>
      </div>

    </div>

    <!-- ===== ইউজার ইমেইল (ছোট করে) ===== -->
    <div class="user-email-bar">
      <span id="user-email-display">user@email.com</span>
    </div>

    <!-- ===== চার্ট সেকশন (Quotex-এর লেআউট) ===== -->
    <div class="chart-section">

      <!-- অ্যাসেট সিলেক্টর + প্রাইস -->
      <div class="chart-header">
        <div class="asset-picker">
          <span class="asset-dot"></span>
          <select id="asset-select" class="asset-select">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="BNBUSDT">BNB/USDT</option>
            <option value="SOLUSDT">SOL/USDT</option>
            <option value="XRPUSDT">XRP/USDT</option>
            <option value="ADAUSDT">ADA/USDT</option>
            <option value="DOGEUSDT">DOGE/USDT</option>
            <option value="MATICUSDT">MATIC/USDT</option>
            <option value="DOTUSDT">DOT/USDT</option>
            <option value="LINKUSDT">LINK/USDT</option>
            <option value="AVAXUSDT">AVAX/USDT</option>
            <option value="LTCUSDT">LTC/USDT</option>
          </select>
          <span class="asset-arrow">▾</span>
        </div>
        <div class="price-box">
          <span id="current-price">0.00</span>
          <span id="price-arrow" class="price-arrow">▲</span>
        </div>
      </div>

      <!-- চার্ট + ড্রয়িং টুলবার (বাম দিকে উল্লম্ব) -->
      <div class="chart-main">

        <!-- বাম দিকে ড্রয়িং টুলবার (Quotex-এর মতো) -->
        <div class="drawing-toolbar" id="drawing-toolbar">
          <button class="drawing-btn" data-tool="cursor" title="Cursor">✥</button>
          <button class="drawing-btn" data-tool="TrendLine" title="Trend Line">╱</button>
          <button class="drawing-btn" data-tool="HorizontalLine" title="Horizontal">━</button>
          <button class="drawing-btn" data-tool="VerticalLine" title="Vertical">┃</button>
          <button class="drawing-btn" data-tool="CrossLine" title="Cross">✚</button>
          <button class="drawing-btn" data-tool="Rectangle" title="Rectangle">▭</button>
          <button class="drawing-btn" data-tool="FibRetracement" title="Fibonacci">⌗</button>
          <button class="drawing-btn" data-tool="Ray" title="Ray">↗</button>
          <button class="drawing-btn" data-tool="TextAnnotation" title="Text">T</button>
          <button class="drawing-btn" data-tool="Eraser" title="Clear All">🗑</button>
        </div>

        <!-- চার্ট + Drawing Canvas (একসাথে) -->
        <div id="chart-wrapper">
          <div id="chart"></div>
          <canvas id="drawing-canvas"></canvas>
        </div>

      </div>

      <!-- টাইমফ্রেম বাটন -->
      <div class="chart-timeframe">
        <button class="tf-btn active" data-tf="1m">1m</button>
        <button class="tf-btn" data-tf="5m">5m</button>
        <button class="tf-btn" data-tf="15m">15m</button>
        <button class="tf-btn" data-tf="1h">1h</button>
        <button class="tf-btn" data-tf="4h">4h</button>
      </div>

    </div>

    <!-- ===== ট্রেড প্যানেল (Quotex-এর মতো) ===== -->
    <div class="trade-panel">

      <!-- পরিমাণ -->
      <div class="trade-row">
        <label class="trade-label">পরিমাণ</label>
        <div class="amount-input-wrap">
          <button class="amount-btn" data-action="minus">−</button>
          <input type="number" id="trade-amount" value="10" min="1" step="1">
          <button class="amount-btn" data-action="plus">+</button>
        </div>
      </div>

      <!-- সময় -->
      <div class="trade-row">
        <label class="trade-label">সময়</label>
        <div class="time-buttons">
          <button class="time-btn active" data-time="60">01:00</button>
          <button class="time-btn" data-time="300">05:00</button>
          <button class="time-btn" data-time="900">15:00</button>
        </div>
      </div>

      <!-- বড় টাইমার (ট্রেড অ্যাক্টিভ হলে দেখাবে) -->
      <div id="big-timer" class="big-timer hidden">01:00</div>

      <!-- CALL / PUT বাটন (Quotex-এর মতো) -->
      <div class="trade-buttons">
        <button id="call-btn" class="call-btn">
          <span class="arrow">▲</span>
          <span class="btn-label">CALL</span>
          <span class="btn-payout">+85%</span>
        </button>
        <button id="put-btn" class="put-btn">
          <span class="arrow">▼</span>
          <span class="btn-label">PUT</span>
          <span class="btn-payout">+85%</span>
        </button>
      </div>

      <!-- ট্রেড মেসেজ -->
      <p id="trade-message"></p>

    </div>

    <!-- ===== ট্যাব (চলমান / হিস্ট্রি) ===== -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="active">
        চলমান <span id="active-count">0</span>
      </button>
      <button class="tab-btn" data-tab="history">হিস্ট্রি</button>
    </div>

    <div class="tab-content">
      <!-- চলমান ট্রেড -->
      <div id="active-trades-list" class="tab-pane active">
        <p class="empty-text">কোনো চলমান ট্রেড নেই</p>
      </div>

      <!-- ট্রেড হিস্ট্রি -->
      <div id="history-list" class="tab-pane">
        <p class="empty-text">এখনো কোনো ট্রেড সম্পন্ন হয়নি</p>
      </div>
    </div>

  </div>
  <!-- dashboard-page শেষ -->

  <script type="module" src="app.js"></script>
</body>
</html>
